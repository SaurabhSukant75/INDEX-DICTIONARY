<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="Discover visual books and follow ideas through Index Dictionary.">
  <title>Index Dictionary</title>
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/app.css">
  <script type="module" src="./src/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <a class="brand" href="#home" aria-label="Index Dictionary home">
      <span class="brand-mark" aria-hidden="true">ID</span>
      <span>INDEX DICTIONARY</span>
    </a>
    <span class="environment-label">A LIBRARY FOR CURIOUS MINDS</span>
  </header>
  <div class="app-layout">
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <section class="nav-section" aria-label="Discover">
        <button class="nav-section-toggle" type="button" data-group-toggle aria-expanded="true" aria-controls="discover-nav">
          <span>Discover</span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <nav class="nav" id="discover-nav">
          <a href="#concepts" data-route="concepts"><span class="nav-icon" aria-hidden="true">◉</span>Concept</a>
          <a href="#paths" data-route="paths"><span class="nav-icon" aria-hidden="true">1→2→3</span>Learning Path</a>
        </nav>
      </section>
      <nav class="nav solo-nav" aria-label="My Learning">
        <a href="#my-learning" data-route="my-learning"><span class="nav-icon" aria-hidden="true">◷</span>My Learning</a>
      </nav>
      <div class="nav-separator" aria-hidden="true"></div>
      <section class="nav-section" aria-label="My Space">
        <button class="nav-section-toggle" type="button" data-group-toggle aria-expanded="true" aria-controls="space-nav">
          <span>My Space</span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <nav class="nav" id="space-nav">
          <a href="#library" data-route="library"><span class="nav-icon" aria-hidden="true">▣</span>My Library</a>
        </nav>
      </section>
      <div class="sidebar-note">
        <strong>Reading stays yours</strong>
        <p>Your saved books and reading activity belong in your personal library on this device.</p>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar" id="topbar">
        <p class="breadcrumb" id="breadcrumb">Index Dictionary / Home</p>
        <div class="top-actions">
          <a class="text-link" href="#topics" data-route="topics">Topics</a>
          <label class="searchbox">
            <span aria-hidden="true">⌕</span>
            <input id="global-search" type="search" placeholder="Search books, topics, concepts…" aria-label="Search books">
          </label>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div id="view-root">
          <p class="loading-state" role="status">Loading Index Dictionary…</p>
        </div>
      </main>
    </div>
  </div>
  <input id="import-file" type="file" accept=".html,.htm,text/html" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
